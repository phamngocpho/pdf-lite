name: Auto Move Project Items
on:
  issues:
    types: [assigned, unassigned]

jobs:
  update-project-status:
    runs-on: ubuntu-latest
    steps:
      - name: Move to In Progress (on assign)
        if: github.event.action == 'assigned'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const projectId = 'PVT_kwHOCIDT2c4BHopI';
            const statusFieldId = 'PVTSSF_lAHOCIDT2c4BHopIzg4VP8U';
            const inProgressOptionId = '47fc9ee4';
            const issueNodeId = context.payload.issue.node_id;
            
            // Tìm project item
            const findItemQuery = `
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const findResult = await github.graphql(findItemQuery, { projectId });
            const projectItem = findResult.node.items.nodes.find(
              item => item.content?.id === issueNodeId
            );
            
            if (!projectItem) {
              console.log('Issue not found in project');
              return;
            }
            
            console.log(`Found project item: ${projectItem.id}`);
            
            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;
            
            await github.graphql(updateMutation, {
              projectId,
              itemId: projectItem.id,
              fieldId: statusFieldId,
              optionId: inProgressOptionId
            });
            
            console.log('Moved to "In progress"');

      - name: Move to Ready (on unassign)
        if: github.event.action == 'unassigned' && github.event.issue.assignees.length == 0
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectId = 'PVT_kwHOCIDT2c4BHopI';
            const statusFieldId = 'PVTSSF_lAHOCIDT2c4BHopIzg4VP8U';
            const readyOptionId = 'f75ad846'; // Bạn cần lấy ID của trạng thái "Ready"
            const issueNodeId = context.payload.issue.node_id;
            
            // Tìm project item
            const findItemQuery = `
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const findResult = await github.graphql(findItemQuery, { projectId });
            const projectItem = findResult.node.items.nodes.find(
              item => item.content?.id === issueNodeId
            );
            
            if (!projectItem) {
              console.log('Issue not found in project');
              return;
            }
            
            // Cập nhật status
            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;
            
            await github.graphql(updateMutation, {
              projectId,
              itemId: projectItem.id,
              fieldId: statusFieldId,
              optionId: readyOptionId
            });
            
            console.log('Moved back to "Ready"');
