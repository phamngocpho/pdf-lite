name: Auto Move on Assign/Unassign

on:
  issues:
    types: [assigned, unassigned]

jobs:
  move-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Move to In progress (on assign)
        if: github.event.action == 'assigned'
        uses: alex-page/github-project-automation-plus@v0.8.1
        with:
          project: PDF-Lite Feature Tracking v1.0
          column: In progress
          repo-token: ${{ secrets.PROJECT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
      
      - name: Move to Ready (on unassign)
        if: github.event.action == 'unassigned'
        uses: alex-page/github-project-automation-plus@v0.8.1
        with:
          project: PDF-Lite Feature Tracking v1.0
          column: Ready
          repo-token: ${{ secrets.PROJECT_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
