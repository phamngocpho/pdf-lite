name: Auto Move to In Progress

on:
  issues:
    types: [assigned]

jobs:
  update-project-status:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Get Project Item ID
        id: get_item
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_TOKEN }}
          script: |
            const projectId = 'PVT_kwHOCIDT2c4BHopI';
            const issueNodeId = context.payload.issue.node_id;
            
            const query = `
              query($projectId: ID!, $issueNodeId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        id
                        content {
                          ... on Issue {
                            id
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;
            
            const variables = {
              projectId: projectId,
              issueNodeId: issueNodeId
            };
            
            const result = await github.graphql(query, variables);
            const items = result.node.items.nodes;
            
            const projectItem = items.find(item => 
              item.content && item.content.id === issueNodeId
            );
            
            if (!projectItem) {
              console.log('Project item not found for this issue');
              return;
            }
            
            core.setOutput('itemId', projectItem.id);
            console.log(`Found project item: ${projectItem.id}`);

      - name: Update Status to In Progress
        if: steps.get_item.outputs.itemId != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const projectId = 'PVT_kwHOCIDT2c4BHopI';
            const statusFieldId = 'PVTSSF_lAHOCIDT2c4BHopIzg4VP8U';
            const inProgressOptionId = '47fc9ee4';
            const itemId = '${{ steps.get_item.outputs.itemId }}';
            
            const mutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(
                  input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: {
                      singleSelectOptionId: $optionId
                    }
                  }
                ) {
                  projectV2Item {
                    id
                  }
                }
              }
            `;
            
            const variables = {
              projectId: projectId,
              itemId: itemId,
              fieldId: statusFieldId,
              optionId: inProgressOptionId
            };
            
            try {
              await github.graphql(mutation, variables);
              console.log('Successfully updated status to "In progress"');
            } catch (error) {
              console.error('Error updating status:', error);
              core.setFailed(error.message);
            }
