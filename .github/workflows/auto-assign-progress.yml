name: Auto Move on Assign/Unassign

on:
  issues:
    types: [assigned, unassigned]

jobs:
  move-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      repository-projects: write
    steps:
      - name: Move issue
        uses: actions/github-script@v7
        with:
          script: |
            const status = context.payload.action === 'assigned' ? 'In progress' : 'Ready';
            
            const projectId = 'PVT_kwHOCIDT2c4BHopI';
            const fieldId = 'PVTSSF_lAHOCIDT2c4BHopIzg4VP8U';
            const optionIds = {
              'Ready': '61e4505c',
              'In progress': '47fc9ee4',
              'In review': 'df73e18b',
              'Done': '98236657'
            };
            
            const optionId = optionIds[status];
            
            if (!optionId) {
              throw new Error(`Status option "${status}" not found`);
            }
            
            await github.graphql(`mutation {
              updateProjectV2ItemFieldValue(
                input: {
                  projectId: "${projectId}"
                  itemId: "${context.payload.issue.node_id}"
                  fieldId: "${fieldId}"
                  value: {singleSelectOptionId: "${optionId}"}
                }
              ) { projectV2Item { id } }
            }`);
