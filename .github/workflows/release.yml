name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch all history for changelog
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Make mvnw executable
      run: chmod +x ./mvnw
    
    - name: Extract version from tag
      id: version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
    
    - name: Update version in pom.xml
      run: ./mvnw versions:set -DnewVersion=${{ steps.version.outputs.VERSION }}
    
    - name: Build Release
      run: ./mvnw clean package -DskipTests
    
    - name: Run Tests
      run: ./mvnw test
    
    - name: Generate Grouped Changelog
      id: changelog
      run: |
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        
        # Get previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        if [ -z "$PREV_TAG" ]; then
          # First release - get all commits
          COMMITS=$(git log --pretty=format:"%s")
        else
          # Get commits since last tag
          COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"%s")
        fi
        
        # Features
        FEATURES=$(echo "$COMMITS" | grep "^feat:" | sed 's/^feat: /- /')
        if [ ! -z "$FEATURES" ]; then
          echo "### Features" >> $GITHUB_OUTPUT
          echo "$FEATURES" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
        fi
        
        # Bug Fixes
        FIXES=$(echo "$COMMITS" | grep "^fix:" | sed 's/^fix: /- /')
        if [ ! -z "$FIXES" ]; then
          echo "### Bug Fixes" >> $GITHUB_OUTPUT
          echo "$FIXES" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
        fi
        
        # Documentation
        DOCS=$(echo "$COMMITS" | grep "^docs:" | sed 's/^docs: /- /')
        if [ ! -z "$DOCS" ]; then
          echo "### Documentation" >> $GITHUB_OUTPUT
          echo "$DOCS" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
        fi
        
        # Other changes
        OTHERS=$(echo "$COMMITS" | grep -v "^feat:" | grep -v "^fix:" | grep -v "^docs:" | grep -v "^chore:" | sed 's/^/- /')
        if [ ! -z "$OTHERS" ]; then
          echo "### Other Changes" >> $GITHUB_OUTPUT
          echo "$OTHERS" >> $GITHUB_OUTPUT
        fi
        
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        name: PDF Lite ${{ github.ref_name }}
        body: |
          ## What's New in ${{ github.ref_name }}
          
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ## Installation
          
          Download `pdf-lite-${{ steps.version.outputs.VERSION }}.jar` and run:
          
          ```bash
          java -jar pdf-lite-${{ steps.version.outputs.VERSION }}.jar
          ```
          
          ## Requirements
          
          - Java 21 or higher
          - Supports: Windows, macOS, Linux
          
          ## Full Changelog
          
          See all changes at: https://github.com/${{ github.repository }}/compare/${{ github.ref_name }}
        files: target/*-shaded.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Upload artifacts (backup)
      uses: actions/upload-artifact@v4
      with:
        name: release-${{ github.ref_name }}
        path: target/*-shaded.jar
        retention-days: 365
