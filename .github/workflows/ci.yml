name: CI Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Make mvnw executable
      run: chmod +x ./mvnw
    
    - name: Build
      run: ./mvnw clean package -DskipTests -T 1C
    
    - name: Upload Executable JAR
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: pdf-lite-build-${{ github.run_number }}
        path: target/*-shaded.jar
        retention-days: 30
