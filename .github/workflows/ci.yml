name: CI Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Make mvnw executable (Unix)
      if: runner.os != 'Windows'
      run: chmod +x ./mvnw
    
    - name: Run Tests (Windows)
      if: runner.os == 'Windows'
      run: ./mvnw.cmd test
    
    - name: Run Tests (Unix)
      if: runner.os != 'Windows'
      run: ./mvnw test
    
    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: ./mvnw.cmd package -DskipTests -T 1C
    
    - name: Build (Unix)
      if: runner.os != 'Windows'
      run: ./mvnw package -DskipTests -T 1C
    
    - name: Rename JAR (Windows)
      if: runner.os == 'Windows'
      run: |
        move target\pdf-lite-1.0-SNAPSHOT.jar target\pdf-lite.jar
    
    - name: Rename JAR (Unix)
      if: runner.os != 'Windows'
      run: |
        mv target/pdf-lite-1.0-SNAPSHOT.jar target/pdf-lite.jar
    
    - name: Publish Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: Test Results (${{ matrix.os }})
        path: target/surefire-reports/TEST-*.xml
        reporter: java-junit
        fail-on-error: true
    
    - name: Test Summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f target/surefire-reports/TEST-*.xml ]; then
          echo "Tests completed. Check artifacts for detailed reports." >> $GITHUB_STEP_SUMMARY
        else
          echo "No test reports found." >> $GITHUB_STEP_SUMMARY
        fi
      shell: bash
    
    - name: Upload Test Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-${{ matrix.os }}-${{ github.run_number }}
        path: target/surefire-reports/
        retention-days: 30
    
    - name: Upload JAR
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: pdf-lite-${{ matrix.os }}-${{ github.run_number }}
        path: target/pdf-lite.jar
        retention-days: 30
